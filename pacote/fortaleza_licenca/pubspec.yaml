name: fortaleza_licenca
description: >-
  Licenca dos aplicativos da Fortaleza Digital Security: portao que so abre o
  app no aparelho liberado pela Central de Licencas (pedido de liberacao sem
  chave, teste gratis, chave curta e renovacao silenciosa).
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
