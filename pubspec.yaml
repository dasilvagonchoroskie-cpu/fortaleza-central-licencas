name: central_licencas
description: "Central de Licencas - Fortaleza Digital Security (uso interno)"
publish_to: 'none'

# versao visivel + codigo de versao. A esteira troca o codigo pelo numero da
# montagem (1000 + n), sempre maior que o da Central 2.x (100 + n).
version: 3.1.0+1000

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
