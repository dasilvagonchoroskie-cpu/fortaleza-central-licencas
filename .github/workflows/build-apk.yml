name: Central de Licencas e pacote de licenca

# Este repositorio tem duas coisas:
#  1) pacote/fortaleza_licenca: o pacote que TODOS os apps vendidos usam
#     (portao de licenca). Analise e testes a cada envio.
#  2) A Central de Licencas 3 (Flutter): analise, testes e APK assinado com
#     a MESMA chave da Central 2.x — instala por cima. Na branch main, o
#     APK vira Release (link direto).
# O resumo de cada montagem fica em logs/ultima-montagem.txt.
on:
  push:
    branches: ['**']
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'
  # Impressao digital da chave da Central (a mesma da 2.x que esta no celular).
  CHAVE_ESPERADA: 'ec4063e42cf39327d55029bf99dcbeab51474b843ae1d15195e84f18d03ff9f2'

permissions:
  contents: write

jobs:
  pacote:
    name: Pacote de licenca (analise e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pacote/fortaleza_licenca
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Baixar dependencias
        run: flutter pub get 2>&1 | tee -a ../../pacote.log

      - name: Analise (flutter analyze)
        run: |
          set -o pipefail
          echo "=== analise do pacote ===" >> ../../pacote.log
          if ! flutter analyze --no-fatal-infos 2>&1 | tee -a ../../pacote.log; then
            grep -E " error | warning |error -|warning -" ../../pacote.log | head -10 | while IFS= read -r l; do echo "::error title=pacote analyze::$l"; done
            exit 1
          fi

      - name: Testes (flutter test)
        run: |
          set -o pipefail
          echo "=== testes do pacote ===" >> ../../pacote.log
          if ! flutter test 2>&1 | tee -a ../../pacote.log; then
            grep -E "FAILED|\[E\]|Expected:|Actual:|Which:|Error:|error:" ../../pacote.log | head -10 | while IFS= read -r l; do echo "::error title=pacote test::$l"; done
            exit 1
          fi

      - name: Guardar o registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-pacote
          path: pacote.log
          if-no-files-found: ignore

  central:
    name: Central de Licencas (Flutter)
    needs: pacote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A Central em Flutter ja esta no repositorio?
        id: tem
        run: |
          if [ -f pubspec.yaml ]; then echo "app=sim" >> "$GITHUB_OUTPUT"; else echo "app=nao" >> "$GITHUB_OUTPUT"; echo "Ainda sem a Central em Flutter: so o pacote foi conferido."; fi

      - uses: actions/setup-java@v5
        if: steps.tem.outputs.app == 'sim'
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        if: steps.tem.outputs.app == 'sim'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Baixar dependencias
        if: steps.tem.outputs.app == 'sim'
        run: flutter pub get 2>&1 | tee -a central.log

      - name: Analise (flutter analyze)
        if: steps.tem.outputs.app == 'sim'
        run: |
          set -o pipefail
          echo "=== analise da Central ===" >> central.log
          if ! flutter analyze --no-fatal-infos 2>&1 | tee -a central.log; then
            grep -E " error | warning |error -|warning -" central.log | head -10 | while IFS= read -r l; do echo "::error title=central analyze::$l"; done
            exit 1
          fi

      - name: Testes (flutter test)
        if: steps.tem.outputs.app == 'sim'
        run: |
          set -o pipefail
          echo "=== testes da Central ===" >> central.log
          if ! flutter test 2>&1 | tee -a central.log; then
            grep -E "FAILED|\[E\]|Expected:|Actual:|Which:|Error:|error:" central.log | head -10 | while IFS= read -r l; do echo "::error title=central test::$l"; done
            exit 1
          fi

      - name: Preparar a chave da Central (a mesma da 2.x)
        if: steps.tem.outputs.app == 'sim'
        env:
          CHAVE: ${{ secrets.CENTRAL_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.CENTRAL_KEYSTORE_SENHA }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$SENHA" ]; then echo "ERRO: faltam os segredos da chave da Central"; exit 1; fi
          echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/central.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreType=pkcs12\n' \
            "$RUNNER_TEMP/central.p12" "$SENHA" "central" "$SENHA" > android/key.properties

      - name: Compilar o APK
        if: steps.tem.outputs.app == 'sim'
        run: |
          NUMERO=$((1000 + ${{ github.run_number }}))
          echo "NUMERO=$NUMERO" >> "$GITHUB_ENV"
          echo "=== compilacao (codigo $NUMERO) ===" >> central.log
          set -o pipefail
          if ! flutter build apk --release --build-number=$NUMERO --dart-define=MONTAGEM=$NUMERO 2>&1 | tee -a central.log; then
            grep -E "^e: |error:|What went wrong|FAILURE|Exception" -A3 central.log | head -10 | while IFS= read -r l; do echo "::error title=central build::$l"; done
            exit 1
          fi
          mkdir -p saida
          cp build/app/outputs/flutter-apk/app-release.apk saida/central-de-licencas.apk
          ls -la saida

      - name: Conferir a chave e o pacote (senao nao publica)
        if: steps.tem.outputs.app == 'sim'
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs saida/central-de-licencas.apk | tee assinatura.txt
          grep -qi "SHA-256 digest: $CHAVE_ESPERADA" assinatura.txt || { echo "ERRO: o APK nao saiu com a chave da Central. Nao publico."; exit 1; }
          LINHA=$("$ANDROID_HOME/build-tools/$BT/aapt2" dump badging saida/central-de-licencas.apk | head -1)
          echo "$LINHA" | tee -a central.log
          echo "$LINHA" | grep -q "name='br.com.fortalezadigitalsecurity.licencas'" || { echo "ERRO: pacote errado"; exit 1; }
          echo "Chave e pacote conferidos: instala por cima da Central 2.x." | tee -a central.log

      - name: Guardar o registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-central
          path: central.log
          if-no-files-found: ignore

      - name: Guardar o APK (artefato)
        if: steps.tem.outputs.app == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: central-de-licencas-apk
          path: saida/central-de-licencas.apk



  emulador:
    name: Abrir no celular virtual (nao pode fechar)
    needs: central
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: central-de-licencas-apk
          path: saida

      - name: Ligar a aceleracao do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Abrir a Central no emulador (por cima da 2.3 e do zero)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulador.sh

      - name: Guardar fotos e registro do emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-emulador
          path: registro-emulador/
          if-no-files-found: ignore

  publicar:
    name: Publicar o APK (so na main, depois do emulador)
    needs: emulador
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: central-de-licencas-apk
          path: saida
      - name: Publicar como Release (link direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: Central de Licencas - versao mais recente
          body: Central de Licencas 3 (Flutter). Instala por cima da 2.x. Na primeira vez, digite a senha de administrador. Uso interno.
          files: saida/central-de-licencas.apk
          prerelease: true

  registro:
    name: Guardar o registro no repositorio
    needs: [pacote, central, emulador]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: registro-*
          path: registros
          merge-multiple: true
      - name: Gravar logs/ultima-montagem.txt
        run: |
          mkdir -p logs
          {
            echo "Montagem ${{ github.run_number }} | branch ${{ github.ref_name }} | commit ${{ github.sha }}"
            echo "pacote: ${{ needs.pacote.result }} | central: ${{ needs.central.result }} | emulador: ${{ needs.emulador.result }}"
            cat registros/emulador-resumo.txt 2>/dev/null
            echo
            cat registros/pacote.log 2>/dev/null | grep -v "^\s*$" | tail -400
            echo
            cat registros/central.log 2>/dev/null | grep -v "^\s*$" | tail -400
          } > logs/ultima-montagem.txt
          rm -rf logs/emulador && mkdir -p logs/emulador
          cp registros/emulador-* logs/emulador/ 2>/dev/null || true
          git config user.name "acoes"
          git config user.email "acoes@local"
          git add logs/ultima-montagem.txt logs/emulador
          git commit -m "registro da montagem ${{ github.run_number }}" || exit 0
          git push || (git pull --rebase && git push) || true
