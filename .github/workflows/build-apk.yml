name: Montar APK da Central de Licencas

# Central de Licencas SEM senha dentro do APK: a senha de administrador e
# digitada uma vez no celular (Ajustes). Por isso este repositorio pode ser
# publico. A esteira confere que nenhuma senha foi parar no APK.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  montar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Conferir que o servidor de licencas esta no ar
        run: |
          RESP=$(curl -s -o corpo.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"chave":"AAAA-BBBB-CCCC-DDDD","app_id":"taximetro","aparelho":"YJPJ-P7EA-DG7B-5BEJ"}' \
            https://fortaleza-licencas.fortalezadigitalsecurity.workers.dev/ativar || echo 000)
          echo "Servidor respondeu HTTP $RESP: $(head -c 200 corpo.txt)"
          if [ "$RESP" != "404" ]; then echo "ERRO: o servidor de licencas nao respondeu como esperado"; exit 1; fi

      - name: Conferir que nao ha senha no codigo
        run: |
          grep -q "var SENHA_PADRAO = '';" www/index.html || { echo "ERRO: a Central nao pode levar senha"; exit 1; }

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # O Android ja vem instalado na maquina do GitHub (ANDROID_HOME), como no
      # taximetro. A peca android-actions/setup-android quebrou em 30/09/2026.
      - name: Conferir o Android da maquina
        run: |
          echo "Android em: $ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | sort -V | tail -3
          ls "$ANDROID_HOME/platforms" | sort -V | tail -3

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      # A tela roda num navegador simulado antes de montar: copiar, recado,
      # WhatsApp e escolha do aplicativo. Se falhar, o APK nao sai.
      - name: Testar a tela (copiar, recado e WhatsApp)
        run: |
          set -o pipefail
          if ! node scripts/teste-tela.mjs 2>&1 | grep -v "Not implemented" | tee teste-tela.log; then
            grep "FALHA" teste-tela.log | head -20 | while IFS= read -r l; do echo "::error title=teste da tela::$l"; done
            exit 1
          fi

      - name: Criar o projeto Android
        run: npx cap add android

      # A versao mora num lugar so (package.json). Aqui ela e carimbada no
      # Android (o que aparece nas Configuracoes do celular) e na tela de
      # Ajustes. Antes o Android ficava sempre no "1.0" de fabrica.
      - name: Carimbar a versao (no Android e na tela de Ajustes)
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          VERSAO=${VERSAO%.0}
          CODIGO=$((100 + ${{ github.run_number }}))
          DATA=$(TZ=America/Sao_Paulo date +%d/%m/%Y)
          sed -i "s/versionCode [0-9][0-9]*/versionCode $CODIGO/; s/versionName \"[^\"]*\"/versionName \"$VERSAO\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -q "versionName \"$VERSAO\"" android/app/build.gradle || { echo "ERRO: nao consegui carimbar a versao no Android"; exit 1; }
          sed -i "s|@@VERSAO@@|$VERSAO (montagem $CODIGO, $DATA)|" www/index.html
          if grep -q "@@VERSAO@@" www/index.html; then echo "ERRO: sobrou o marcador de versao na tela"; exit 1; fi
          echo "VERSAO_APP=$VERSAO" >> "$GITHUB_ENV"
          echo "Versao $VERSAO, codigo $CODIGO, data $DATA"

      - name: Sincronizar
        run: npx cap sync android

      # Sem o plugin da area de transferencia, o "Copiar" volta a falhar.
      - name: Conferir o plugin de copiar dentro do projeto Android
        run: |
          grep -q "capacitor-clipboard" android/capacitor.settings.gradle || { echo "ERRO: o plugin Clipboard nao entrou no APK"; exit 1; }
          echo "Plugin Clipboard: conferido."

      - name: Aplicar a marca (icone e tela de abertura)
        run: |
          python3 -m venv /tmp/marca
          /tmp/marca/bin/pip install --quiet pillow
          /tmp/marca/bin/python marca/aplicar-marca.py

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Assinar com a chave da Central
        env:
          CHAVE: ${{ secrets.CENTRAL_KEYSTORE_BASE64 }}
          SENHA: ${{ secrets.CENTRAL_KEYSTORE_SENHA }}
        run: |
          if [ -z "$CHAVE" ] || [ -z "$SENHA" ]; then echo "ERRO: faltam os segredos da chave da Central"; exit 1; fi
          echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/central.p12"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          ENTRADA=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p saida
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$ENTRADA" saida/alinhado.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/central.p12" --ks-type PKCS12 \
            --ks-pass env:SENHA --ks-key-alias central --key-pass env:SENHA \
            --out saida/central-de-licencas.apk saida/alinhado.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs saida/central-de-licencas.apk | head -3
          rm -f saida/alinhado.apk "$RUNNER_TEMP/central.p12"

      - name: Conferir a versao dentro do APK pronto (senao nao publica)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          LINHA=$("$ANDROID_HOME/build-tools/$BT/aapt2" dump badging saida/central-de-licencas.apk | head -1)
          echo "$LINHA"
          echo "$LINHA" | grep -q "versionName='$VERSAO_APP'" || { echo "ERRO: o APK nao saiu com a versao $VERSAO_APP"; exit 1; }

      - name: Conferir que o APK nao leva senha (senao nao publica)
        run: |
          unzip -p saida/central-de-licencas.apk assets/public/index.html > pagina.html
          grep -q "var SENHA_PADRAO = '';" pagina.html || { echo "ERRO: achei senha dentro do APK. Nao publico."; exit 1; }
          echo "APK sem senha: conferido."

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: central-de-licencas-apk
          path: saida/central-de-licencas.apk

      - name: Publicar como Release (link direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: Central de Licencas - versao mais recente
          body: Central de Licencas sem senha dentro do APK. Na primeira vez, digite a senha de administrador em Ajustes. Uso interno.
          files: saida/central-de-licencas.apk
          prerelease: true
